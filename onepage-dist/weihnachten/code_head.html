var m = Math.round((Date.now() - dt) / 6e4); if (m < 60) return 'vor ' + Math.max(1, m) + ' Min.';
var h = Math.round(m / 60); if (h < 24) return 'vor ' + h + ' Std.';
var dd = Math.round(h / 24); return dd === 1 ? 'vor 1 Tag' : 'vor ' + dd + ' Tagen';
}
function shortName(n) {
n = String(n || '').trim();
if (!n || /https?:|www\.|@|\.(de|com|net|org|eu|io|shop)\b|\d/i.test(n)) return '';
var w = n.replace(/[^\p{L}\s-]/gu, ' ').split(/\s+/).filter(Boolean);
if (!w.length || w[0].length < 2) return '';
return w[0][0].toUpperCase() + w[0].slice(1, 18) + (w[1] ? ' ' + w[1][0].toUpperCase() + '.' : '');
}
function renderMsgs() {
var box = $('#wxMsgs'), more = $('#wxMore');
if (!msgs.length) {
box.className = '';
box.innerHTML = '<div class="wx-empty"><h4 class="wx-card-title">Hier erscheinen die neuesten Spenden.</h4><p class="wx-muted">Sei die erste Person, deren Spende hier auftaucht.</p>' +
'<a href="#spenden" class="button w-inline-block"><div class="button_label"><div class="button_text">Jetzt spenden</div><div class="button_text is-clone">Jetzt spenden</div></div><div data-i="heart" data-s="btn" data-c="white" class="ico"></div></a></div>';
more.hidden = true; return;
}
box.className = 'wx-msgs';
box.innerHTML = msgs.map(function (m) {
var amt = +m.amount > 0 ? eur(+m.amount) : 'Eine Spende', n = shortName(m.name);
var ini = n ? n.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase() : '♥';
return '<article class="wx-msg wx-don' + (m.sample ? ' is-sample' : '') + (n ? '' : ' is-anon') + '"><span class="wx-msg-av" aria-hidden="true">' + esc(ini) + '</span>' +
'<span class="wx-msg-who">' + esc(n || 'Anonym') + '<small>' + esc(amt) + ' gespendet · ' + esc(m.sample ? 'Beispiel' : ago(m.time)) + '</small></span></article>';
}).join('');
$$('.wx-msg').forEach(function (el, i) { reveal(el, '', (i % 6) * 90); });
limitRows();
}
function limitRows() {
var box = $('#wxMsgs'), more = $('#wxMore'), cards = $$('#wxMsgs .wx-msg');
if (!cards.length) { more.hidden = true; return; }
var cols = (getComputedStyle(box).gridTemplateColumns || '').split(' ').filter(Boolean).length || 1, max = cols * 3;
cards.forEach(function (c, i) { c.hidden = !showAll && i >= max; });
more.hidden = cards.length <= max;
more.textContent = showAll ? 'Weniger anzeigen' : 'Alle ' + cards.length + ' Spenden anzeigen';
}
$('#wxMore').addEventListener('click', function () {
showAll = !showAll; limitRows();
if (!showAll) $('.wx-msgs-head').scrollIntoView({ block: 'start', behavior: 'smooth' });
});
var lrT; W.addEventListener('resize', function () { clearTimeout(lrT); lrT = setTimeout(limitRows, 150); });
function pick(o, keys) { for (var i = 0; i < keys.length; i++) { if (o[keys[i]] != null && o[keys[i]] !== '') return o[keys[i]]; } return ''; }
if (W.wxPreview) $('.wx-preview').hidden = false;
render(0, 0);
W.wxTwingle().then(function (t) {
var line = t.split('\n').filter(function (l) { return l.indexOf('__twingle_projectData') > -1; })[0];
var o = JSON.parse(line.trim().replace(/^var __twingle_projectData\s*=\s*/, '').replace(/;\s*$/, ''));
render(+o.project_target_amount || 0, +o.project_target_donators || 0);
msgs = (o.project_donations || []).map(function (x) {
var dd = x.data || x; // twingle setzt data.name nur bei Zustimmung (showDonation); Nachrichten lesen wir bewusst nie
return { amount: pick(x, ['amount']), name: pick(dd, ['name']), time: pick(x, ['timestamp', 'created_at', 'date', 'time']), sample: x.sample };
});
renderMsgs();
}).catch(function () { d.documentElement.classList.add('wx-load-error'); renderMsgs(); });
var frame = $('.wx-frame'), form = $('#spendenformular');
function loadForm(amount) {
var src = CFG.form + '?tw_amount=' + (amount || 40);
if (amount || !frame.getAttribute('src')) { form.classList.add('is-tw-loading'); frame.src = src; }
}
new IntersectionObserver(function (es, o) {
if (es[0].isIntersecting) { o.disconnect(); loadForm(); }
}, { rootMargin: '600px 0px' }).observe(form);
W.addEventListener('message', function (e) {
if (e.source !== frame.contentWindow) return;
var m = e.data;
if (m && m.type === 'size' && +m.value > 0) { frame.style.height = (Math.ceil(+m.value) + 40) + 'px'; form.classList.remove('is-tw-loading'); }
});
$$('.wx-amount').forEach(function (a) {
a.addEventListener('click', function () {
$$('.wx-amount').forEach(function (x) { x.classList.toggle('is-active', x === a); });
loadForm(a.getAttribute('data-amount'));
});
});
var dlg = $('#wxShare'), toast = $('#wxToast'), tt;
function say(t) { (dlg.open ? dlg : d.body).appendChild(toast); toast.textContent = t; toast.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove('is-on'); }, 2200); }
function copy(t, ok) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { say(ok); }).catch(function () { W.prompt('Zum Kopieren:', t); }); }
$('#wxShWa').href = 'https://wa.me/?text=' + encodeURIComponent(CFG.shareText + ' ' + CFG.shareUrl);
$('#wxShMail').href = 'mailto:?subject=' + encodeURIComponent('Weihnachten soll leuchten') + '&body=' + encodeURIComponent(CFG.shareText + '\n\n' + CFG.shareUrl);
$('#wxShCopy').addEventListener('click', function () { copy(CFG.shareUrl, 'Link kopiert'); });
$('#wxShClose').addEventListener('click', function () { dlg.close(); });
dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); }); // Klick auf den Hintergrund
$$('[data-share]').forEach(function (b) {
b.addEventListener('click', function () {
if (navigator.share) { navigator.share({ title: 'Weihnachten soll leuchten', text: CFG.shareText, url: CFG.shareUrl }).catch(function () {}); return; }
if (dlg.showModal) dlg.showModal(); else copy(CFG.shareUrl, 'Link kopiert');
});
});
var dock = $('.wx-dock'), bar = $('.wx-barometer'), donate = $('#spenden');
function onDock() {
var r = donate.getBoundingClientRect(), b = bar.getBoundingClientRect();
var hide = (r.top < W.innerHeight * 0.8 && r.bottom > 0) || b.bottom > 0 || d.body.classList.contains('is-menu-open');
dock.classList.toggle('is-on', !hide);
}
W.addEventListener('scroll', onDock, { passive: true }); onDock();
})();
});</script>
